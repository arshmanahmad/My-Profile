<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020d0b"/>
      <stop offset="100%" style="stop-color:#041a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10d9a0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0ea87a;stop-opacity:1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <circle cx="200" cy="150" r="120" fill="#10d9a0" opacity="0.06" filter="url(#blur)"/>
  <circle cx="600" cy="300" r="150" fill="#10d9a0" opacity="0.05" filter="url(#blur)"/>

  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#10d9a0" stroke-width="0.4" opacity="0.12"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#10d9a0" stroke-width="0.4" opacity="0.12"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#10d9a0" stroke-width="0.4" opacity="0.12"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#10d9a0" stroke-width="0.4" opacity="0.12"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#10d9a0" stroke-width="0.4" opacity="0.12"/>

  <!-- Border -->
  <rect width="800" height="450" fill="none" stroke="#10d9a0" stroke-width="1" opacity="0.15" rx="2"/>

  <!-- Logo circle -->
  <circle cx="400" cy="185" r="52" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="400" cy="185" r="42" fill="#10d9a0" opacity="0.08"/>

  <!-- S letter -->
  <text x="400" y="205" font-family="Georgia, serif" font-size="54" font-weight="bold" fill="url(#glow)" text-anchor="middle" opacity="0.95">S</text>

  <!-- Title -->
  <text x="400" y="272" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f0fdf4" text-anchor="middle" letter-spacing="6">SMARLEDGER</text>

  <!-- Tagline -->
  <text x="400" y="308" font-family="Arial, sans-serif" font-size="13" fill="#10d9a0" text-anchor="middle" opacity="0.75" letter-spacing="2">OWNED PRODUCT</text>

  <!-- Dots -->
  <circle cx="370" cy="330" r="2" fill="#10d9a0" opacity="0.4"/>
  <circle cx="400" cy="330" r="2" fill="#10d9a0" opacity="0.7"/>
  <circle cx="430" cy="330" r="2" fill="#10d9a0" opacity="0.4"/>
</svg>
